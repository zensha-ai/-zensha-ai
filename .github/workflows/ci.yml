name: CI

# Runs on every push and pull request. Vercel's Git integration handles
# deployment (production on `main`, preview URLs for pull requests).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build without secrets: the site renders honest "not connected" states.
      NEXT_PUBLIC_SITE_URL: https://zenshaai.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src scripts

      - name: Generate route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit -p .

      - name: Unit tests
        run: npx vitest run

      - name: Script tests
        run: node --test scripts/configure-supabase-env.test.mjs

      - name: Production build
        run: npx next build
